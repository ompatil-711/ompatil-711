name: Update contribution graphic

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-graphic
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate activity.svg
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          from datetime import date
          from pathlib import Path
          from xml.sax.saxutils import escape
          import xml.etree.ElementTree as ET

          query = """
          query {
            user(login: "ompatil-711") {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      weekday
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "profile-activity-generator",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)

          if result.get("errors"):
              raise RuntimeError(json.dumps(result["errors"]))

          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          weeks = calendar["weeks"]
          days = [day for week in weeks for day in week["contributionDays"]]

          if not days:
              raise RuntimeError("GitHub returned no contribution data.")

          total = calendar["totalContributions"]
          active = sum(day["contributionCount"] > 0 for day in days)
          colors = ["#252521", "#514735", "#806A43", "#B49258", "#E3C78F"]

          def color(count):
              if count == 0:
                  return colors[0]
              if count <= 2:
                  return colors[1]
              if count <= 5:
                  return colors[2]
              if count <= 9:
                  return colors[3]
              return colors[4]

          def text(x, y, value, size=12, fill="#AAA69F", extra=""):
              return (
                  f'<text x="{x}" y="{y}" font-size="{size}" '
                  f'fill="{fill}" {extra}>{escape(str(value))}</text>'
              )

          step = 16
          cell = 12
          left = 54
          top = 112
          width = max(900, left + len(weeks) * step + 28)
          height = 274

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'viewBox="0 0 {width} {height}" role="img" '
              f'aria-labelledby="title description">',
              '<title id="title">Om Patil — GitHub contribution activity</title>',
              f'<desc id="description">{total} contributions and {active} '
              'active days over the past year.</desc>',
              f'<rect x="1" y="1" width="{width-2}" height="{height-2}" '
              'rx="16" fill="#151515" stroke="#34332F"/>',
              '<g font-family="Arial, Helvetica, sans-serif">',
              text(28, 32, "THE WORK BETWEEN THE MILESTONES", 11, "#C7A76C",
                   'letter-spacing="2"'),
              text(28, 66, f"{total:,} contributions", 26, "#F5F2EC",
                   'font-weight="700"'),
              text(width - 28, 64, f"{active} active days · past year", 12,
                   "#AAA69F", 'text-anchor="end"'),
          ]

          previous_month = None
          for column, week in enumerate(weeks):
              first = date.fromisoformat(week["contributionDays"][0]["date"])
              month = (first.year, first.month)
              if month != previous_month:
                  parts.append(text(left + column * step, 98, first.strftime("%b"), 10))
                  previous_month = month

              for day in week["contributionDays"]:
                  count = day["contributionCount"]
                  x = left + column * step
                  y = top + day["weekday"] * step
                  tooltip = escape(f'{day["date"]}: {count} contributions')
                  parts.append(
                      f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" '
                      f'rx="3" fill="{color(count)}"><title>{tooltip}</title></rect>'
                  )

          for row, label in [(1, "Mon"), (3, "Wed"), (5, "Fri")]:
              parts.append(text(25, top + row * step + 10, label, 10))

          parts.append(text(28, 249, f'{days[0]["date"]} — {days[-1]["date"]}', 10))
          parts.append(text(width - 172, 249, "Less", 10))

          for index, fill in enumerate(colors):
              parts.append(
                  f'<rect x="{width-140+index*16}" y="238" '
                  f'width="12" height="12" rx="3" fill="{fill}"/>'
              )

          parts.append(text(width - 48, 249, "More", 10))
          parts.extend(["</g>", "</svg>"])

          svg = "\n".join(parts)
          ET.fromstring(svg)
          Path("activity.svg").write_text(svg, encoding="utf-8")

      - name: Save generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.svg
          if git diff --cached --quiet; then
            echo "Graphic is already current."
          else
            git commit -m "Update contribution graphic"
            git push origin HEAD:main
          fi
